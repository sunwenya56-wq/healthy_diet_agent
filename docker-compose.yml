services:
  # ============================================================
  # 应用：FastAPI Agent（端口 8000）
  # ============================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthy-diet-agent
    ports:
      - "8000:8000"
    environment:
      # LLM / VLM
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com/v1}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_MOCK=${LLM_MOCK:-0}
      - VISION_MOCK=${VISION_MOCK:-0}
      - VLM_INGREDIENT_MODEL=${VLM_INGREDIENT_MODEL:-deepseek-chat}
      # ASR / TTS（容器里没 Windows SAPI，TTS 会降级成静音 mock）
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - ASR_BASE_URL=${ASR_BASE_URL:-https://api.siliconflow.cn/v1}
      - ASR_MODEL=${ASR_MODEL:-XingChenAGI/XingChenGSR-V1.0}
      # 存储
      - DATABASE_URL=mysql+pymysql://root:rootpass@mysql:3306/diet_agent?charset=utf8mb4
      - VECTOR_BACKEND=milvus
      - MILVUS_URI=http://milvus:19530
      - MILVUS_COLLECTION=${MILVUS_COLLECTION:-diet_guidelines}
      - MILVUS_HISTORY_COLLECTION=${MILVUS_HISTORY_COLLECTION:-user_history}
      # YOLO 模型（挂载到容器）
      - YOLO_MODEL_PATH=/app/models/best.pt
      # API
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./models:/app/models:ro
      - ./data/uploads:/app/data/uploads
      - app-data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      milvus:
        condition: service_started
    restart: unless-stopped
    networks:
      - agent-net


  # ============================================================
  # MySQL 8 —— 用户画像 + 运行快照
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: healthy-diet-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=diet_agent
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--default-authentication-plugin=mysql_native_password"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - agent-net


  # ============================================================
  # Milvus 向量库 —— 膳食指南 + 用户历史交互
  # Milvus standalone 依赖 etcd + minio，下面三服务是固定三件套
  # ============================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: healthy-diet-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd-data
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - agent-net


  minio:
    image: minio/minio:RELEASE.2024-03-07T02-05-43Z
    container_name: healthy-diet-minio
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - agent-net


  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: healthy-diet-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"   # Milvus Attu 管理界面
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agent-net

volumes:
  mysql-data:
  milvus-data:
  etcd-data:
  minio-data:
  app-data:

networks:
  agent-net:
    driver: bridge
